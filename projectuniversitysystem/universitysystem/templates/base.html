{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
        extend: {
            colors: {
            npurple : '#836DFF',
            npurplelight: '#A291FF',
            nbackpurple: "#F5F5FF",
            nblack: "#1C1B1F",
            nlightblack: "#404040",
            nwhite: "#FEFEFE",
            }
        }
        }
    }
    </script>
    <title>{% block title %} Site {% endblock %}</title>        
</head>  
<body class="bg-nbackpurple text-nblack">
    <header class="bg-nwhite p-4">
        <div class="flex items-center justify-between relative space-x-4 mx-40">
            
            <!-- Esquerda -->
            <a href="{% url 'home_view' %}"
            class="">
            <img src="{% static 'img/USlogo.svg' %}" 
                 alt="UniversitySystem Logo">
            </a>

            <div class="">
            <a href="{% url 'home_view' %}" 
                class="text-lg font-medium text-nblack relative before:absolute before:-top-6 before:w-0 before:h-1 before:bg-npurple before:transition-all hover:before:w-full">
                Início
            </a>
            </div>

            <div class="relative group h-full flex items-center">
                <button class="text-lg font-medium text-nblack relative flex items-center gap-1 cursor-pointer
                               before:absolute before:-top-6 before:w-0 before:h-1 before:bg-npurple before:transition-all group-hover:before:w-full">
                    Ensino
                    <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>

                <div class="absolute left-0 top-full pt-6 hidden group-hover:block z-50 min-w-[200px]">
                    <div class="bg-nwhite rounded-lg shadow-xl border border-gray-100 py-2 overflow-hidden">
                        <a href="{% url 'historico_view' %}" class="flex items-center px-4 py-3 text-npurple hover:bg-nbackpurple transition-colors font-medium">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            Histórico
                        </a>
                    </div>
                </div>
            </div>

            <div class="">
            <a href="{% url 'notas_view' %}" 
                class="text-lg font-medium text-nblack relative before:absolute before:-top-6 before:w-0 before:h-1 before:bg-npurple before:transition-all hover:before:w-full">
                Notas
            </a>
            </div>

            <div class="">
            <a href="{% url 'restaurante_view' %}" 
                class="text-lg font-medium text-nblack relative before:absolute before:-top-6 before:w-0 before:h-1 before:bg-npurple before:transition-all hover:before:w-full">
                Restaurante
            </a>
            </div>

            <div class="">
            <a href="{% url 'home_view' %}" 
                class="text-lg font-medium text-nblack relative before:absolute before:-top-6 before:w-0 before:h-1 before:bg-npurple before:transition-all hover:before:w-full">
                Matrícula
            </a>
            </div>

            <div class="">
            <a href="{% url 'profile' %}" class="flex items-center space-x-4 relative before:absolute before:-top-4 before:w-0 before:h-1 before:bg-npurple before:transition-all hover:before:w-full">
                <div class="flex flex-col">
                    <span class="text-base font-medium text-nblack">{{ user.first_name}} {{ user.last_name }}</span>
                    <span class="text-base font-medium text-npurple -mt-1">Perfil</span>
                </div>
                <div class="w-10 h-10 bg-npurple rounded-full flex-shrink-0 relative">
                {% if user.foto %}
                    <img src="{{ user.foto.url }}" 
                    alt="Profile Picture" class="w-10 h-10 rounded-full">
                {% endif %}
                </div>    
            </a>
            </div>

        </div>
    </header>
    <main class="p-4 ml-40 mr-40">
        {% block content %}
        <!-- Conteúdo -->
        {% endblock %}
    </main>
    <footer class="bg-npurple text-nwhite p-4 mt-4 text-center">
        &copy; 2025 UniversitySystem. Todos os direitos reservados.
    </footer>
</body>
</html>
