{% extends "base.html" %}
{% load static %}

{% block title %}
UniversitySystem - Meu Perfil
{% endblock %}

{% block content %}
<div class="space-y-10 p-8 bg-nwhite rounded-xl shadow-lg">

    <h1 class="text-3xl font-bold text-nlightblack">Meu Perfil</h1>

    <div class="flex items-start space-x-10 border-b border-gray-200 pb-8">

        <div class="w-48 h-48 bg-npurple rounded-full flex-shrink-0 relative">
            {% if aluno.foto_url %}
            <img src="{{ aluno.foto_url }}" alt="Foto do Perfil" class="w-full h-full object-cover rounded-full">
            {% endif %}
        </div>

        <div class="pt-6">
            <h2 class="text-3xl font-bold text-nblack mb-4">
                Aluno(a): {{ user.get_full_name|default:"User Name" }}
            </h2>

            <div class="flex space-x-3">
                <button
                    class="bg-npurple hover:bg-npurplelight text-nwhite font-medium py-2 px-4 rounded-md transition duration-200 shadow-md">
                    Editar foto de perfil
                </button>

                <button
                    class="bg-transparent hover:bg-nbackpurple text-npurple border border-npurple font-medium py-2 px-4 rounded-md transition duration-200">
                    Remover foto
                </button>
            </div>
        </div>
    </div>

    <div class="space-y-8">
        <h2 class="text-3xl font-bold text-npurple mb-6">Informações</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

            <div>
                <label for="cpf" class="block text-sm font-medium text-nlightblack mb-2">CPF</label>
                <input type="text" id="cpf" value="{{ aluno.cpf }}" disabled
                    class="w-full p-3 border border-npurplelight rounded-md bg-nwhite text-nblack font-medium"
                    aria-label="CPF do usuário">
            </div>

            <div>
                <label for="nome" class="block text-sm font-medium text-nlightblack mb-2">Nome</label>
                <input type="text" id="nome" value="{{ user.first_name }}" disabled
                    class="w-full p-3 border border-npurplelight rounded-md bg-nwhite text-nblack font-medium"
                    aria-label="Primeiro nome do usuário">
            </div>

            <div>
                <label for="sobrenome" class="block text-sm font-medium text-nlightblack mb-2">Sobrenome</label>
                <input type="text" id="sobrenome" value="{{ user.last_name }}" disabled
                    class="w-full p-3 border border-npurplelight rounded-md bg-nwhite text-nblack font-medium"
                    aria-label="Sobrenome do usuário">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-nlightblack mb-2">Email</label>
                <input type="email" id="email" value="{{ user.email }}" disabled
                    class="w-full p-3 border border-npurplelight rounded-md bg-nwhite text-nblack font-medium"
                    aria-label="Email do usuário">
            </div>

            <div>
                <label for="tipo" class="block text-sm font-medium text-nlightblack mb-2">Tipo</label>
                <input type="text" id="tipo" value="{{ user.get_funcao_display }}" disabled
                    class="w-full p-3 border border-npurplelight rounded-md bg-nwhite text-nblack font-medium"
                    aria-label="Tipo de usuário (Aluno, Professor, etc.)">
            </div>

            <div>
                <label for="matricula" class="block text-sm font-medium text-nlightblack mb-2">Matrícula</label>
                <input type="text" id="matricula" value="{{ aluno.matricula }}" disabled
                    class="w-full p-3 border border-npurplelight rounded-md bg-nwhite text-nblack font-medium"
                    aria-label="Número de matrícula do aluno">
            </div>

        </div>

    </div>

</div>
{% endblock %}
