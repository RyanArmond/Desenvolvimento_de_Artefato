{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    npurple : '#836DFF',
                    npurplelight: '#A291FF',
                    nbackpurple: "#F5F5FF",
                    nblack: "#1C1B1F",
                    nlightblack: "#404040",
                    nwhite: "#FEFEFE",
                },
                backgroundImage: {
                    'loginbg': "url('{% static 'img/backgroundlogin.png' %}')",
                }
            }
        }
    }
    </script>
    <title>Login - UniversitySystem</title>
</head>
<body class="bg-nbackpurple flex items-center justify-center min-h-screen p-4 ">

    <div class="bg-nwhite rounded-3xl shadow-xl overflow-hidden flex flex-col md:flex-row w-full max-w-4xl lg:max-w-5xl 2xl:max-w-6xl min-h-[480px] 2xl:min-h-[650px]">
        
        <div class="hidden md:flex md:w-1/2 bg-loginbg p-12 flex-col justify-between relative">
            <div class="absolute inset-0 bg-white/10 mix-blend-overlay"></div>
            <h1 class="text-nwhite text-3xl font-bold z-10">US</h1>
        </div>

        <div class="w-full md:w-1/2 p-8 2xl:p-12 flex flex-col justify-center relative">
            
            <div class="max-w-md mx-auto w-full">
                <h2 class="text-3xl 2xl:text-4xl font-bold text-nblack mb-2">Bem Vindo</h2>
                
                <p class="text-npurple text-xs 2xl:text-sm mb-6 2xl:mb-8 leading-relaxed">
                    Disciplinas, notas, informações da comunidade acadêmica, tarefas e projetos - tudo em um só lugar.
                </p>

                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 p-2 bg-red-100 text-red-600 rounded text-xs text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4 2xl:mb-5">
                        <label class="block text-nblack text-sm font-semibold mb-1 2xl:mb-2" for="username">
                            Email ou Usuário
                        </label>
                        <input class="w-full px-4 py-2.5 2xl:py-3 rounded-lg border border-gray-300 focus:border-npurple focus:ring-2 focus:ring-npurple/20 outline-none transition-all text-nblack placeholder-gray-400 text-sm 2xl:text-base"
                               type="text" 
                               name="username" 
                               id="username" 
                               placeholder="Seu_Usuario ou email" 
                               required>
                    </div>

                    <div class="mb-5 2xl:mb-6 relative">
                        <div class="flex justify-between items-center mb-1 2xl:mb-2">
                            <label class="block text-nblack text-sm font-semibold" for="password">
                                Senha
                            </label>
                            <a href="#" class="text-xs 2xl:text-sm text-npurple hover:underline font-medium">
                                Esqueceu sua senha?
                            </a>
                        </div>
                        <input class="w-full px-4 py-2.5 2xl:py-3 rounded-lg border border-gray-300 focus:border-npurple focus:ring-2 focus:ring-npurple/20 outline-none transition-all text-nblack placeholder-gray-400 text-sm 2xl:text-base"
                               type="password" 
                               name="password" 
                               id="password" 
                               placeholder="*************" 
                               required>

                    </div>

                    <button type="submit" class="w-full bg-npurple hover:bg-[#6f5add] text-white font-bold py-2.5 2xl:py-3 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-sm 2xl:text-base">
                        Entrar
                    </button>
                </form>

                <div class="flex items-center my-4 2xl:my-6">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-xs 2xl:text-sm">ou</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <div class="flex justify-center">
                    <div id="g_id_onload"
                        data-client_id="932850632858-qpckuf3a3jbd7f6eg5rke9mvilcve3l0.apps.googleusercontent.com"
                        data-context="signin"
                        data-ux_mode="popup"
                        data-login_uri="http://localhost:8000/login_google/"
                        data-auto_select="true"
                        data-itp_support="true">
                    </div>

                    <div class="g_id_signin"
                        data-type="standard"
                        data-shape="rectangular"
                        data-theme="outline"
                        data-text="signin_with"
                        data-size="large"
                        data-logo_alignment="center"
                        data-width="450">
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
